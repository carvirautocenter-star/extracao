<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cadastro Rápido - TempAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0f19',
                        cardbg: '#131c2e',
                        primary: '#2563eb',
                        accent: '#10b981',
                        danger: '#ef4444'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .glass-panel { background: rgba(19, 28, 46, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        
        .btn-mic { background: #1e293b; color: #94a3b8; transition: all 0.2s; }
        .btn-mic:hover { background: #334155; color: #e2e8f0; }
        .btn-mic.listening { background: #ef4444; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        
        .json-viewer { font-family: 'Courier New', Courier, monospace; font-size: 12px; }
        input[type="text"].time-input { letter-spacing: 2px; font-family: monospace; font-size: 1.1rem; font-weight: bold; }

        #toast { visibility: hidden; min-width: 250px; background-color: #10b981; color: #fff; text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 100; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 14px; font-weight: bold; opacity: 0; transition: opacity 0.3s, bottom 0.3s; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
    </style>
</head>
<body class="bg-darkbg text-slate-300 min-h-screen flex flex-col">

    <header class="border-b border-slate-800 bg-cardbg/80 backdrop-blur-md sticky top-0 z-20 px-4 lg:px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-primary/20 flex items-center justify-center text-primary border border-primary/30 shadow-[0_0_15px_rgba(37,99,235,0.2)]">
                <i class="fa-solid fa-headset text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-white tracking-wide">Cadastro por Voz</h1>
                <p class="text-[11px] text-slate-400 uppercase tracking-widest font-semibold">TempAR Data</p>
            </div>
        </div>
        <button onclick="copyToClipboard()" class="bg-accent hover:bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2 shadow-lg shadow-accent/20">
            <i class="fa-regular fa-copy"></i> <span class="hidden sm:inline">Copiar JSON</span>
        </button>
    </header>

    <main class="flex-1 p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-7xl mx-auto w-full">
        
        <!-- Coluna 1: Formulário de Cadastro -->
        <div class="lg:col-span-5 flex flex-col gap-4">
            <div class="glass-panel rounded-2xl p-5 shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-emerald-400"></div>
                
                <h2 class="text-sm font-bold text-white uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-primary"></i> Adicionar Novo Serviço
                </h2>

                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nome do Serviço</label>
                    <div class="flex gap-2">
                        <input type="text" id="inputServiceName" placeholder="Ex: Troca de Bomba D'água" 
                               onblur="checkExistingService(this.value)"
                               class="flex-1 bg-darkbg border border-slate-700 rounded-lg py-3 px-3 text-sm text-white focus:outline-none focus:border-primary transition placeholder-slate-600">
                        <button type="button" onclick="startVoiceInput('inputServiceName', this)" class="btn-mic w-12 rounded-lg flex items-center justify-center shrink-0 border border-slate-700">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-5">
                    <label class="block text-xs font-semibold text-slate-400 mb-1 flex justify-between">
                        <span>Tempo de Execução</span>
                        <span class="text-[10px] text-slate-500 font-normal">Máx: 168:00 (7 dias)</span>
                    </label>
                    <div class="relative">
                        <input type="text" id="inputTime" placeholder="00:00" inputmode="numeric" class="time-input w-full bg-darkbg border border-slate-700 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-cyan-500 transition text-center" oninput="maskTimeInput(this)">
                        <div class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
                            <i class="fa-regular fa-clock text-slate-600"></i>
                        </div>
                    </div>
                </div>

                <div class="mb-5 bg-slate-800/40 rounded-xl p-3 border border-slate-700/50">
                    <label class="block text-xs font-semibold text-slate-400 mb-2 flex justify-between items-center">
                        <span>Insumos Necessários</span>
                        <span class="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded" id="partsCount">0 itens</span>
                    </label>
                    
                    <ul id="tempPartsList" class="space-y-2 mb-3 max-h-40 overflow-y-auto"></ul>

                    <div class="flex gap-2">
                        <input type="text" id="inputPartName" placeholder="Adicionar insumo..." class="flex-1 bg-darkbg border border-slate-700 rounded-lg py-2 px-3 text-xs text-white focus:outline-none focus:border-primary transition placeholder-slate-600" onkeypress="if(event.key === 'Enter') addTempPart()">
                        <button type="button" onclick="addTempPart()" class="bg-slate-700 hover:bg-slate-600 text-white w-9 rounded-lg flex items-center justify-center shrink-0 transition">
                            <i class="fa-solid fa-plus text-xs"></i>
                        </button>
                        <button type="button" onclick="startVoiceInput('inputPartName', this)" class="btn-mic w-9 rounded-lg flex items-center justify-center shrink-0 border border-slate-700">
                            <i class="fa-solid fa-microphone text-xs"></i>
                        </button>
                    </div>
                </div>

                <button type="button" onclick="saveService()" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition text-sm flex justify-center items-center gap-2 shadow-lg shadow-primary/20">
                    <i class="fa-solid fa-check"></i> Adicionar à Lista
                </button>
            </div>
        </div>

        <!-- Coluna 2: Serviços Cadastrados -->
        <div class="lg:col-span-4 flex flex-col">
            <div class="glass-panel rounded-2xl p-4 flex-1 flex flex-col max-h-[80vh]">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-emerald-400"></i> Serviços Cadastrados
                    </h2>
                    <button onclick="clearAllServices()" class="text-[10px] text-rose-400 hover:text-rose-300 font-semibold bg-rose-500/10 px-2 py-1 rounded transition"><i class="fa-solid fa-trash"></i> Limpar</button>
                </div>
                
                <div id="savedServicesContainer" class="flex-1 overflow-y-auto pr-1 space-y-3"></div>
            </div>
        </div>

        <!-- Coluna 3: JSON -->
        <div class="lg:col-span-3 flex flex-col">
            <div class="glass-panel rounded-2xl p-4 flex-1 flex flex-col max-h-[80vh] bg-[#0d1117] border-slate-700">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-database"></i> JSON Output <span id="jsonCount" class="bg-emerald-900 text-emerald-300 px-1.5 py-0.5 rounded text-[10px]">0</span>
                    </h2>
                    <button onclick="updateJSON()" class="text-slate-500 hover:text-emerald-400 transition" title="Forçar Atualização"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
                <div class="flex-1 overflow-auto bg-black/60 rounded-xl p-3 border border-slate-800">
                    <pre id="jsonOutput" class="json-viewer text-emerald-300">[]</pre>
                </div>
            </div>
        </div>

    </main>

    <div id="toast">Insumos reaproveitados com sucesso!</div>

    <script>
        // --- ESTADO GLOBAL E PERSISTÊNCIA ---
        let savedServices = JSON.parse(localStorage.getItem('tempario_services_v2')) || [];
        let tempParts = []; 

        function persistData() {
            localStorage.setItem('tempario_services_v2', JSON.stringify(savedServices));
        }

        // --- REAPROVEITAMENTO ---
        function checkExistingService(serviceName) {
            if (!serviceName || serviceName.trim() === '') return;
            const existing = savedServices.find(s => s.service_name.toLowerCase().trim() === serviceName.toLowerCase().trim());
            
            if (existing && existing.parts && existing.parts.length > 0) {
                if (tempParts.length === 0) {
                    tempParts = [...existing.parts];
                    renderTempParts();
                    showToast();
                }
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // --- MÁSCARA DE TEMPO ---
        function maskTimeInput(input) {
            let digits = input.value.replace(/\D/g, "");
            if (digits.length > 5) digits = digits.substring(0, 5);
            if (parseInt(digits) > 16800) digits = "16800";

            let hours = "00", minutes = "00";
            if (digits.length === 0) { input.value = ""; return; }

            if (digits.length <= 2) {
                minutes = digits.padStart(2, '0');
            } else {
                minutes = digits.slice(-2);
                hours = digits.slice(0, -2).padStart(2, '0');
            }

            let mInt = parseInt(minutes), hInt = parseInt(hours);
            if (mInt >= 60) {
                hInt += Math.floor(mInt / 60);
                mInt = mInt % 60;
            }
            input.value = `${hInt.toString().padStart(2, '0')}:${mInt.toString().padStart(2, '0')}`;
        }

        function timeToMinutes(timeStr) {
            if(!timeStr || !timeStr.includes(':')) return 0;
            const [h, m] = timeStr.split(':').map(Number);
            return (h * 60) + m;
        }

        // --- LÓGICA DE VOZ ---
        let recognition = null;
        let isListening = false;
        let activeMicBtn = null;

        function startVoiceInput(targetInputId, btnElement) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Seu navegador não suporta entrada de voz.');
                return;
            }

            if (isListening) {
                if (recognition) recognition.stop();
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                activeMicBtn = btnElement;
                btnElement.classList.add('listening');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                const targetInput = document.getElementById(targetInputId);
                if (targetInput) {
                    targetInput.value = transcript;
                    if(targetInputId === 'inputServiceName') {
                        setTimeout(() => checkExistingService(transcript), 300);
                    }
                }
            };

            recognition.onerror = () => stopVoice();
            recognition.onend = () => stopVoice();
            recognition.start();
        }

        function stopVoice() {
            isListening = false;
            if (activeMicBtn) {
                activeMicBtn.classList.remove('listening');
                activeMicBtn = null;
            }
            if (recognition) {
                recognition.stop();
                recognition = null;
            }
        }

        // --- INSUMOS TEMPORÁRIOS ---
        function addTempPart() {
            const input = document.getElementById('inputPartName');
            const val = input.value.trim();
            if (val) {
                tempParts.push(val);
                input.value = '';
                renderTempParts();
            }
            input.focus();
        }

        function removeTempPart(index) {
            tempParts.splice(index, 1);
            renderTempParts();
        }

        function renderTempParts() {
            const list = document.getElementById('tempPartsList');
            document.getElementById('partsCount').innerText = `${tempParts.length} itens`;
            
            if (tempParts.length === 0) {
                list.innerHTML = `<li class="text-[11px] text-slate-500 italic text-center py-2">Nenhum insumo adicionado.</li>`;
                return;
            }

            list.innerHTML = tempParts.map((part, i) => `
                <li class="flex items-center justify-between bg-darkbg border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-300 group">
                    <span><i class="fa-solid fa-box text-slate-500 mr-2 text-[10px]"></i>${part}</span>
                    <button type="button" onclick="removeTempPart(${i})" class="text-slate-500 hover:text-red-400 opacity-50 group-hover:opacity-100 transition"><i class="fa-solid fa-xmark"></i></button>
                </li>
            `).join('');
        }

        // --- SALVAR SERVIÇO ---
        function saveService() {
            const nameInput = document.getElementById('inputServiceName');
            const timeInput = document.getElementById('inputTime');
            const partInput = document.getElementById('inputPartName');

            const name = nameInput.value.trim();
            const timeStr = timeInput.value.trim();
            const timeMins = timeToMinutes(timeStr);

            if (!name) return alert("Informe o nome do serviço.");
            if (timeMins <= 0) return alert("Informe um tempo válido.");

            if (partInput.value.trim() !== '') {
                tempParts.push(partInput.value.trim());
                partInput.value = '';
            }

            const newService = {
                id: Date.now(),
                service_name: name,
                time_minutes: timeMins,
                time_display: timeStr,
                parts: [...tempParts]
            };

            const existingIndex = savedServices.findIndex(s => s.service_name.toLowerCase() === name.toLowerCase());
            
            if (existingIndex > -1) {
                savedServices[existingIndex] = newService;
            } else {
                savedServices.push(newService);
            }

            persistData();

            // Limpa a tela
            nameInput.value = '';
            timeInput.value = '';
            partInput.value = '';
            tempParts = [];
            renderTempParts();
            nameInput.focus();

            // Atualiza a interface e o JSON
            renderSavedServices();
            updateJSON(); // Chamada extra para garantir
        }

        function removeSavedService(index) {
            if(confirm('Remover este serviço?')) {
                savedServices.splice(index, 1);
                persistData();
                renderSavedServices();
                updateJSON();
            }
        }

        function clearAllServices() {
            if(confirm('Tem certeza que deseja apagar TUDO?')) {
                savedServices = [];
                persistData();
                renderSavedServices();
                updateJSON();
            }
        }

        // --- RENDERIZAR ---
        function renderSavedServices() {
            const container = document.getElementById('savedServicesContainer');
            
            if (savedServices.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-10 flex flex-col items-center"><i class="fa-regular fa-folder-open text-3xl mb-3 opacity-40"></i><p class="text-xs">Nenhum serviço cadastrado.</p></div>`;
                return;
            }

            let html = '';
            savedServices.forEach((svc, index) => {
                // Garante que parts seja um array (segurança)
                const parts = svc.parts || [];
                
                html += `
                    <div class="bg-darkbg border border-slate-700 rounded-xl p-3 relative group shadow-sm">
                        <button onclick="removeSavedService(${index})" class="absolute top-2 right-2 text-slate-600 hover:text-red-500 transition"><i class="fa-solid fa-circle-xmark"></i></button>
                        <h3 class="font-bold text-white text-sm mb-1 pr-6">${svc.service_name}</h3>
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-[10px] text-cyan-400 bg-cyan-950/50 px-2 py-0.5 rounded font-mono"><i class="fa-regular fa-clock mr-1"></i>${svc.time_display}</span>
                            <span class="text-[10px] text-slate-500">(${svc.time_minutes} min)</span>
                        </div>
                        <div class="bg-slate-800/40 rounded p-2">
                            <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">Insumos</p>
                            <ul class="space-y-0.5">
                                ${parts.length > 0 
                                    ? parts.map(p => `<li class="text-[11px] text-slate-300"><i class="fa-solid fa-caret-right text-slate-600 mr-1 text-[9px]"></i>${p}</li>`).join('')
                                    : '<li class="text-[10px] text-slate-500 italic">Nenhum</li>'}
                            </ul>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // --- FUNÇÃO DO JSON ATUALIZADA E BLINDADA ---
        function updateJSON() {
            const outputEl = document.getElementById('jsonOutput');
            const countEl = document.getElementById('jsonCount');
            
            if(!outputEl) return;

            // Cria uma versão limpa e segura para o JSON
            const jsonClean = savedServices.map(svc => ({
                service_name: svc.service_name,
                time_minutes: svc.time_minutes,
                parts: (svc.parts || []).map(p => ({ part_name: p }))
            }));

            // Converte para string formatada
            const jsonString = JSON.stringify(jsonClean, null, 2);
            
            // Aplica ao DOM
            outputEl.innerText = jsonString;
            countEl.innerText = jsonClean.length;
        }

        function copyToClipboard() {
            if(savedServices.length === 0) return alert("Adicione serviços primeiro.");
            const jsonString = document.getElementById('jsonOutput').innerText;
            
            navigator.clipboard.writeText(jsonString).then(() => {
                const btn = document.querySelector('button[onclick="copyToClipboard()"]');
                const original = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Copiado!';
                btn.classList.replace('bg-accent', 'bg-emerald-700');
                setTimeout(() => {
                    btn.innerHTML = original;
                    btn.classList.replace('bg-emerald-700', 'bg-accent');
                }, 2000);
            });
        }

        // --- INICIALIZAÇÃO ---
        document.addEventListener('DOMContentLoaded', () => {
            renderTempParts();
            renderSavedServices();
            updateJSON(); // Chama para carregar o que já estava salvo
        });
    </script>
</body>
</html>
