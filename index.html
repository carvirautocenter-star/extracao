<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Extractor - TempAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0f19',
                        cardbg: '#131c2e',
                        primary: '#2563eb',
                        accent: '#10b981'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .glass-panel { background: rgba(19, 28, 46, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        textarea { resize: vertical; }
        .json-viewer { font-family: 'Courier New', Courier, monospace; font-size: 13px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-darkbg text-slate-300 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-cardbg/50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-primary/20 flex items-center justify-center text-primary">
                <i class="fa-solid fa-robot text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-white">Data Extractor <span class="text-xs bg-primary/20 text-primary px-2 py-0.5 rounded ml-2 border border-primary/30">v2.0</span></h1>
                <p class="text-xs text-slate-400">Extração inteligente de Serviços e Insumos</p>
            </div>
        </div>
        <button onclick="copyToClipboard()" class="bg-accent hover:bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2">
            <i class="fa-regular fa-copy"></i> Copiar JSON
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Coluna 1: Entrada de Dados -->
        <div class="lg:col-span-4 flex flex-col gap-4">
            <div class="glass-panel rounded-xl p-4 flex-1 flex flex-col h-[80vh]">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-white uppercase tracking-wider"><i class="fa-solid fa-keyboard text-slate-400 mr-2"></i>Texto / Imagem</h2>
                    <button onclick="clearInput()" class="text-xs text-rose-400 hover:text-rose-300"><i class="fa-solid fa-trash"></i> Limpar</button>
                </div>
                
                <!-- OCR Upload -->
                <div class="mb-4 border-2 border-dashed border-slate-600 rounded-lg p-3 text-center hover:border-primary transition cursor-pointer relative bg-slate-800/30">
                    <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="processImage(this)">
                    <i class="fa-solid fa-camera text-xl text-slate-400 mb-1"></i>
                    <p class="text-xs text-slate-300 font-medium">Tirar Print ou Anexar Imagem</p>
                    <p class="text-[10px] text-slate-500 mt-1">O OCR extrairá o texto automaticamente</p>
                </div>
                <div id="ocrProgress" class="mb-2 text-xs text-center text-primary hidden font-semibold animate-pulse"></div>

                <textarea id="rawText" class="w-full flex-1 bg-darkbg border border-slate-700 rounded-lg p-3 text-sm text-slate-300 focus:outline-none focus:border-primary placeholder-slate-600 mb-3" placeholder="Ou cole o texto aqui..."></textarea>
                
                <button onclick="processText()" class="w-full bg-primary hover:bg-blue-600 text-white font-semibold py-3 rounded-lg transition text-sm flex justify-center items-center gap-2 shadow-lg shadow-primary/20">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Processar Dados
                </button>
            </div>
        </div>

        <!-- Coluna 2: Editor -->
        <div class="lg:col-span-5 flex flex-col">
            <div class="glass-panel rounded-xl p-4 flex-1 flex flex-col h-[80vh]">
                <h2 class="text-sm font-bold text-white uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-slate-400"></i> Revisar Extração
                </h2>
                
                <div id="editorContainer" class="flex-1 overflow-y-auto pr-2 space-y-4">
                    <div class="text-center text-slate-500 py-10 flex flex-col items-center">
                        <i class="fa-solid fa-file-invoice text-4xl mb-3 opacity-50"></i>
                        <p class="text-sm">Aguardando dados...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Coluna 3: JSON (Supabase) -->
        <div class="lg:col-span-3 flex flex-col">
            <div class="glass-panel rounded-xl p-4 flex-1 flex flex-col h-[80vh] bg-[#0d1117]">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-sm font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-database"></i> JSON Supabase
                    </h2>
                </div>
                <div class="flex-1 overflow-auto bg-black/50 rounded-lg p-3 border border-slate-800">
                    <pre id="jsonOutput" class="json-viewer text-emerald-300">[]</pre>
                </div>
                <p class="text-[10px] text-slate-500 mt-2 text-center">Sem preços. Apenas tempos e insumos.</p>
            </div>
        </div>

    </main>

    <script>
        let extractedServices = [];

        function clearInput() {
            document.getElementById('rawText').value = '';
            extractedServices = [];
            renderEditor();
        }

        // --- MELHORIA NA LÓGICA DE EXTRAÇÃO ---
        function processText() {
            const rawText = document.getElementById('rawText').value;
            if (!rawText.trim()) return alert("Por favor, insira algum texto ou imagem.");

            let lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            
            // Palavras que devem ser ignoradas (lixo da interface)
            const noiseWords = [
                "empresas", "clientes", "mkt", "crm", "tempario", "semsusto", "luciano", "viagens", 
                "pagar.me", "você está no", "assine", "não encontrei", "selecione", "consulta",
                "serviço", "tempo real", "valor", "ações", "orçamentos", "dados da oficina",
                "custo de", "tabela de", "mecânicos", "controle de", "lubrificaçao", // Palavras soltas
                "1h", "45min" // Vamos processar os tempos reais, mas ignorar se vierem soltos sem contexto
            ];

            // Regex para capturar tempos (45min, 5h30m, 1h)
            const timeRegex = /^(\d+)h\s*(\d*)m?$|^(\d+)\s*min$/i;

            let currentService = null;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                let lowerLine = line.toLowerCase();

                // 1. Ignorar preços (linhas com R$)
                if (line.includes('R$')) continue;

                // 2. Ignorar ruídos exatos
                if (noiseWords.includes(lowerLine)) continue;

                // 3. Identificar Tempo
                const timeMatch = line.match(timeRegex);
                
                if (timeMatch) {
                    // A linha ANTERIOR a um tempo é sempre o Nome do Serviço.
                    // Pegamos a linha i-1 (se existir e não for um tempo ou preço)
                    let serviceName = lines[i - 1] || "Serviço Sem Nome";
                    
                    // Se a linha anterior for um preço (ex: R$), voltamos mais uma
                    if(serviceName.includes('R$')) serviceName = lines[i - 2] || "Serviço Sem Nome";

                    // Converte o tempo para minutos totais
                    let mins = 0;
                    if (timeMatch[0].includes('h')) {
                        let h = parseInt(timeMatch[1]) || 0;
                        let m = parseInt(timeMatch[2]) || 0;
                        mins = (h * 60) + m;
                    } else {
                        mins = parseInt(timeMatch[3]) || 0;
                    }

                    currentService = {
                        id: Date.now() + i,
                        name: serviceName,
                        time: mins,
                        parts: []
                    };
                    
                    extractedServices.push(currentService);
                    continue; // Pula para a próxima linha
                }

                // 4. Se não for tempo, preço ou ruído, e temos um serviço ativo na memória...
                if (currentService) {
                    // Precisamos saber se essa linha é um insumo ou o nome do PRÓXIMO serviço.
                    // Verificamos a PRÓXIMA linha. Se a próxima for um tempo, a atual é o nome do serviço.
                    let nextLine = lines[i + 1] || "";
                    let nextIsTime = nextLine.match(timeRegex);

                    if (!nextIsTime && !line.includes('R$')) {
                        // Se a próxima linha não for tempo, então a linha atual é um INSUMO
                        currentService.parts.push(line);
                    }
                }
            }

            // Limpa duplicatas de serviços que possam ter sido criados errados
            extractedServices = extractedServices.filter(s => s.name !== "Serviço Sem Nome");
            
            renderEditor();
        }

        function minutesToReadable(mins) {
            if (!mins) return "0h";
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            return `${h > 0 ? h + 'h ' : ''}${m > 0 ? m + 'm' : ''}`.trim() || "0h";
        }

        // --- RENDERIZAÇÃO E EDIÇÃO ---
        function renderEditor() {
            const container = document.getElementById('editorContainer');
            
            if (extractedServices.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-10 flex flex-col items-center"><p class="text-sm">Nenhum serviço extraído.</p></div>`;
                updateJSON();
                return;
            }

            let html = '';
            extractedServices.forEach((svc, index) => {
                html += `
                    <div class="bg-darkbg border border-slate-700 rounded-lg p-3 relative group">
                        <button onclick="removeService(${index})" class="absolute top-2 right-2 text-slate-500 hover:text-rose-500 transition" title="Excluir Serviço"><i class="fa-solid fa-circle-xmark"></i></button>
                        
                        <input type="text" value="${svc.name}" onchange="updateField(${index}, 'name', this.value)" class="w-full bg-transparent border-b border-slate-700 text-white font-semibold focus:outline-none focus:border-primary mb-2 pb-1 text-sm pr-6" placeholder="Nome do Serviço">
                        
                        <div class="mb-3">
                            <label class="text-[10px] text-slate-500 uppercase">Tempo Real (minutos)</label>
                            <div class="flex items-center gap-2 bg-slate-800/50 rounded px-3 py-1.5">
                                <input type="number" value="${svc.time}" onchange="updateField(${index}, 'time', this.value)" class="w-full bg-transparent text-cyan-400 text-sm focus:outline-none">
                                <span class="text-xs text-slate-400 font-mono bg-slate-700/50 px-2 py-0.5 rounded">${minutesToReadable(svc.time)}</span>
                            </div>
                        </div>

                        <div class="bg-slate-800/30 rounded p-2 border border-slate-700/50">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[10px] font-bold text-slate-400 uppercase"><i class="fa-solid fa-boxes-stacked mr-1"></i> Insumos</span>
                                <button onclick="addPart(${index})" class="text-[10px] text-primary hover:text-blue-400 font-semibold bg-primary/10 px-2 py-1 rounded transition"><i class="fa-solid fa-plus"></i> Add</button>
                            </div>
                            <ul class="space-y-1">
                                ${svc.parts.map((part, pIndex) => `
                                    <li class="flex items-center justify-between bg-darkbg border border-slate-700 rounded px-2 py-1 group/item">
                                        <input type="text" value="${part}" onchange="updatePart(${index}, ${pIndex}, this.value)" class="bg-transparent text-xs text-slate-300 w-full focus:outline-none">
                                        <button onclick="removePart(${index}, ${pIndex})" class="text-slate-500 hover:text-rose-400 ml-2 opacity-50 group-hover/item:opacity-100 transition"><i class="fa-solid fa-xmark text-[10px]"></i></button>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            updateJSON();
        }

        function updateField(index, field, value) {
            if (field === 'time') value = parseFloat(value) || 0;
            extractedServices[index][field] = value;
            if (field === 'time') renderEditor();
            else updateJSON();
        }

        function updatePart(svcIndex, partIndex, value) {
            extractedServices[svcIndex].parts[partIndex] = value;
            updateJSON();
        }

        function addPart(svcIndex) {
            extractedServices[svcIndex].parts.push("Novo Insumo");
            renderEditor();
        }

        function removePart(svcIndex, partIndex) {
            extractedServices[svcIndex].parts.splice(partIndex, 1);
            renderEditor();
        }

        function removeService(index) {
            if(confirm('Excluir este serviço?')) {
                extractedServices.splice(index, 1);
                renderEditor();
            }
        }

        // --- GERAR JSON SUPABASE ---
        function updateJSON() {
            const supabaseFormat = extractedServices.map(svc => ({
                service_name: svc.name,
                time_minutes: svc.time,
                parts: svc.parts.map(p => ({ part_name: p }))
            }));
            document.getElementById('jsonOutput').textContent = JSON.stringify(supabaseFormat, null, 2);
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(document.getElementById('jsonOutput').textContent).then(() => {
                const btn = document.querySelector('button[onclick="copyToClipboard()"]');
                const original = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Copiado!';
                setTimeout(() => btn.innerHTML = original, 2000);
            });
        }

        // --- OCR ---
        async function processImage(input) {
            if (!input.files || !input.files[0]) return;
            
            const progressDiv = document.getElementById('ocrProgress');
            progressDiv.classList.remove('hidden');
            progressDiv.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Lendo imagem...';
            
            try {
                const result = await Tesseract.recognize(
                    input.files[0],
                    'por',
                    { logger: m => {
                        if (m.status === 'recognizing text') {
                            progressDiv.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Extraindo: ${Math.round(m.progress * 100)}%`;
                        }
                    }}
                );
                
                // Coloca o texto no textarea e já processa automaticamente
                document.getElementById('rawText').value = result.data.text;
                progressDiv.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> Sucesso! Processando...';
                
                setTimeout(() => {
                    processText();
                    progressDiv.classList.add('hidden');
                }, 800);
                
            } catch (error) {
                console.error(error);
                progressDiv.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-rose-400"></i> Erro no OCR.';
                setTimeout(() => progressDiv.classList.add('hidden'), 3000);
            }
            input.value = ''; 
        }
    </script>
</body>
</html>
